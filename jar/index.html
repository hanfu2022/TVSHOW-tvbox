<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>战时通讯系统 —— 致力冲破信息封锁</title>
<meta name="description" content="在危机来临时，给你帮助，互相自助，冲破信息封锁">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">无视国内监管和封杀<span class="accent">全球媒体监管</span></div>
    <div class="tagline">不用登录 · 全部都是匿名，你的爆料专家，没有政府监管，保护你的言论自由，并用最快速度帮你全球直播</div>
  </div>
  <nav class="tab-bar" id="tabBar" role="tablist" aria-label="内容分类"></nav>
</header>

<main>
  <section class="publish-wrap">
    <form class="publish-card" id="publishForm">
      <textarea id="publishText" placeholder="这里仅支持文字发布、或者图片发布，其他小文件也支持上传，但是只有大哥才能获取，这里不提供展示，无视监管）" maxlength="2000"></textarea>
      <div class="file-preview" id="filePreview"></div>
      <div class="publish-row">
        <div class="publish-actions">
          <label class="file-btn">
            📎 选图片
            <input type="file" id="publishFiles" accept="image/*" multiple>
          </label>
          <select id="publishCategory" aria-label="选择分类"></select>
        </div>
        <button type="submit" id="publishSubmit">发布</button>
      </div>
    </form>
  </section>

  <section class="feed-wrap">
    <div id="feed"></div>
    <div id="loadingIndicator"><span class="spinner"></span>稍等片刻…</div>
    <div id="scrollSentinel"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
