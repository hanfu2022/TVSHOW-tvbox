<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墙上 · 谁都能贴的图文墙</title>
<meta name="description" content="不用注册,谁都能发布图片和文字的公开图文墙,内容存储在 Telegram。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">墙上<span class="accent">Wall.</span></div>
    <div class="tagline">不用登录 · 谁都能贴 · 内容存在 Telegram 里</div>
  </div>
  <nav class="tab-bar" id="tabBar" role="tablist" aria-label="内容分类"></nav>
</header>

<main>
  <section class="publish-wrap">
    <form class="publish-card" id="publishForm">
      <textarea id="publishText" placeholder="写点什么…（可以不写,但至少要有图或字其中一样）" maxlength="2000"></textarea>
      <div class="file-preview" id="filePreview"></div>
      <div class="publish-row">
        <div class="publish-actions">
          <label class="file-btn">
            📎 选图片
            <input type="file" id="publishFiles" accept="image/*" multiple>
          </label>
          <select id="publishCategory" aria-label="选择分类"></select>
        </div>
        <button type="submit" id="publishSubmit">发布</button>
      </div>
    </form>
  </section>

  <section class="feed-wrap">
    <div id="feed"></div>
    <div id="loadingIndicator"><span class="spinner"></span>加载中…</div>
    <div id="scrollSentinel"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="onfg.js"></script>
<script src="app.js"></script>
</body>
</html>
